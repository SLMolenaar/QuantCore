name: Build and publish

on:
  release:
    types: [published]

jobs:
  build_linux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      matrix:
        python: ["cp39-cp39", "cp310-cp310", "cp311-cp311", "cp312-cp312"]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        run: |
          PYBIN="/opt/python/${{ matrix.python }}/bin"
          "$PYBIN/pip" install scikit-build-core pybind11 build
          "$PYBIN/python" -m build --wheel --outdir /tmp/built_wheel .

      - name: Repair wheel
        run: |
          pip3 install auditwheel
          auditwheel repair /tmp/built_wheel/*.whl --wheel-dir wheelhouse/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python }}
          path: wheelhouse/*.whl

  build_macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        run: |
          pip install scikit-build-core pybind11 build
          python -m build --wheel --outdir wheelhouse/ .

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python }}
          path: wheelhouse/*.whl

  build_windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        run: |
          pip install scikit-build-core pybind11 build
          python -m build --wheel --outdir wheelhouse/ .

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python }}
          path: wheelhouse/*.whl

  publish:
    needs: [build_linux, build_macos, build_windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheelhouse/