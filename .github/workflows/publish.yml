name: Build and publish

on:
  release:
    types: [published]

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Cache cibuildwheel tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-cache-${{ runner.os }}-20271

      - name: Pre-download virtualenv
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/cibw-cache"
          DEST="${{ runner.temp }}/cibw-cache/virtualenv-20.27.1.pyz"
          if [ ! -f "$DEST" ]; then
            curl -fsSL "https://github.com/pypa/get-virtualenv/blob/20.27.1/public/virtualenv.pyz?raw=true" -o "$DEST"
          fi

      - uses: pypa/cibuildwheel@v2.22
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686"
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_BEFORE_BUILD_LINUX: "pip install pybind11"
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64"
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheelhouse
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheelhouse/